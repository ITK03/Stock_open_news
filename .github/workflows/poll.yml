name: poll-tdnet

# 適時開示を取得→分析→docs/data を更新してコミット。GitHub Pages がそれを配信。
#
# 重要: GitHub の毎時 cron は宣言通りには起動せず、実測では3〜4時間おきにしか
# 走らないことがある(高頻度 cron はさらに間引かれる)。そこで「1回起動したら
# 長時間ループして数分おきに取得し続ける常駐ジョブ」方式にし、ループ時間を
# cron 間隔の実測値より長い330分にすることで、起動同士がオーバーラップして
# 常時稼働に近い状態を作る。加えて毎回 src.main が当日+前日の開示を
# まるごと(limit指定なし=既定3000件/日)取得するため、間引きで空いた空白期間の
# 取りこぼしも次回起動時に自己修復される。
# public リポジトリは Actions 無制限無料なので常時稼働でもコスト0。
#
# 自己連鎖(self-chaining)について: cron の間引きに更新の空白を依存させない
# ため、330分ループの最後に `gh workflow run poll.yml` で自分自身を
# workflow_dispatch 起動する。workflow_dispatch は GITHUB_TOKEN からの呼び出し
# でも連鎖起動できる公式の例外に該当するため、これにより cron を待たず常時
# 稼働が継続する。cron は連鎖が何らかの理由で途切れた場合の再点火役として
# 残す(cancel-in-progress のオーバーラップ置換により、cron 起動が来ても
# 実行中のループを安全に置き換えて連鎖を継続できる)。

on:
  workflow_dispatch: {}
  schedule:
    # 1時間ごとに起動を試みる(JST 08:00-19:59 の平日)。実際は間引かれて
    # 3〜4時間おきの起動になることがあるが、330分ループのオーバーラップと
    # 当日+前日の全件取得により空白期間は自己修復される。自己連鎖が動いて
    # いる限りこの cron は主な起動源ではなく、連鎖切れ時の保険として働く。
    - cron: "0 23 * * 0-4"    # JST 08:00 (月-金)
    - cron: "0 0-10 * * 1-5"  # JST 09:00-19:59 (月-金)

permissions:
  contents: write
  actions: write   # 自己連鎖(gh workflow run poll.yml)に必要

concurrency:
  group: poll-tdnet
  cancel-in-progress: true   # 新しい起動が走ったら古いループは止めて最新に置き換える
                              # (cron や自己連鎖の新起動が置換した側として連鎖を継続するため途切れない)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll loop (約330分・約90秒間隔・当日+前日を全件取得・終了時に自己連鎖)
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_MIN_SCORE: ${{ vars.LLM_MIN_SCORE }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          EARNINGS_ENABLED: ${{ vars.EARNINGS_ENABLED }}
          EARNINGS_PER_RUN: ${{ vars.EARNINGS_PER_RUN }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # 本リポジトリは非公開のため、raw も GitHub Pages もブラウザから読めない。
          # 統合ダッシュボード(公開リポ Stock_sikin_ryunyu)へ配信データだけを
          # 同期する。トークンは Stock_sikin_ryunyu への contents:write が必要。
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          PUBLIC_REPO: "ITK03/Stock_sikin_ryunyu"
          PUBLIC_BRANCH: "data-disclosures"
          ARCHIVE_SYNC_DAYS: "30"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 最新版の disclosures.json は「data」orphanブランチに毎回force-pushする
          # (履歴は常に1コミット=リポジトリが無限に肥大化しない)。マージ継続性の
          # ため、ループ開始時に data ブランチの現行版を取り込んでおく。
          # docs/data/archive(追記型・日次1ファイル)だけを main にコミットする。
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git show "$(git ls-remote origin data | cut -f1)":disclosures.json 2>/dev/null \
              > docs/data/disclosures.json || true
          fi

          # data ブランチへ最新 disclosures.json を単一コミットとしてforce-pushする。
          push_disclosures() {
            local tmp; tmp="$(mktemp -d)"
            cp docs/data/disclosures.json "$tmp/disclosures.json"
            ( cd "$tmp" \
              && git init -q -b data \
              && git config user.name "github-actions[bot]" \
              && git config user.email "github-actions[bot]@users.noreply.github.com" \
              && git add disclosures.json \
              && git commit -q -m "data: update disclosures [skip ci]" \
              && git push --force -q "$REPO_URL" HEAD:data )
            local rc=$?; rm -rf "$tmp"; return $rc
          }

          # 公開リポへ配信データを同期する。disclosures.json(最新)と直近の
          # アーカイブだけを orphan ブランチへ force-push する
          # (履歴は常に1コミット。全期間のアーカイブを送ると年々肥大化するため
          #  直近 ARCHIVE_SYNC_DAYS 日ぶんに絞る)。
          sync_public() {
            [ -n "${CROSS_REPO_TOKEN:-}" ] || return 9
            local tmp; tmp="$(mktemp -d)"
            mkdir -p "$tmp/archive"
            cp docs/data/disclosures.json "$tmp/disclosures.json" 2>/dev/null || { rm -rf "$tmp"; return 1; }
            # 直近ぶんのアーカイブと索引
            if [ -d docs/data/archive ]; then
              cp docs/data/archive/index.json "$tmp/archive/" 2>/dev/null || true
              ls -1 docs/data/archive/[0-9]*.json 2>/dev/null | sort | tail -n "$ARCHIVE_SYNC_DAYS" \
                | while read -r f; do cp "$f" "$tmp/archive/"; done
            fi
            ( cd "$tmp" \
              && git init -q -b "$PUBLIC_BRANCH" \
              && git config user.name "github-actions[bot]" \
              && git config user.email "github-actions[bot]@users.noreply.github.com" \
              && git add -A \
              && git commit -q -m "data: 開示データを公開リポへ同期 [skip ci]" \
              && git push --force -q \
                 "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" \
                 "HEAD:${PUBLIC_BRANCH}" )
            local rc=$?; rm -rf "$tmp"; return $rc
          }

          # トークン未設定を黙って握りつぶすと、配信が止まっていることに
          # 気づけない(セクター同期が2週間止まっていた原因がこれ)。
          # 起動時に1度だけ、はっきり分かる形で警告する。
          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo "::error::CROSS_REPO_TOKEN が未設定です。本リポジトリは非公開のため、"\
                 "このままでは統合ダッシュボードの開示タブにデータが届きません。"
            echo "## ⚠ 開示データが配信されていません" >> "$GITHUB_STEP_SUMMARY"
            echo "CROSS_REPO_TOKEN シークレットを設定してください（${PUBLIC_REPO} への contents:write）。" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          last_hash=""
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # limit は指定しない(src.main の既定 = 当日+前日を1日あたり3000件まで丸ごと取得)
            python -m src.main || echo "main failed (continue)"

            # ① 追記型アーカイブのみ main にコミット(履歴の増加は日次1ファイル分に限定)
            if [ -n "$(git status --porcelain docs/data/archive 2>/dev/null)" ]; then
              git add docs/data/archive
              git commit -m "data: archive [skip ci]" || true
              for i in 1 2 3 4; do
                git pull --rebase origin "$BRANCH" \
                  && git push origin "HEAD:$BRANCH" && break
                echo "push retry $i"; sleep $((2 ** i))
              done
            fi

            # ② 最新 disclosures.json は変化時のみ data ブランチへforce-push
            if [ -s docs/data/disclosures.json ]; then
              h="$(sha1sum docs/data/disclosures.json | cut -d' ' -f1)"
              if [ "$h" != "$last_hash" ]; then
                if push_disclosures; then last_hash="$h"; else echo "disclosures push失敗(継続)"; fi
                # 公開リポへも同期する(統合ダッシュボードの配信元)
                sync_public
                case $? in
                  0) echo "公開リポへ同期 完了" ;;
                  9) echo "CROSS_REPO_TOKEN 未設定のため公開リポ同期をスキップ" ;;
                  *) echo "::warning::公開リポへの同期に失敗しました(継続)" ;;
                esac
              else
                echo "disclosures 変更なし"
              fi
            fi
            sleep 90
          done

          # 自己連鎖: cron の間引きを待たずに次の330分ループを即座に起動する。
          # workflow_dispatch は GITHUB_TOKEN からの呼び出しでも連鎖起動できる
          # 公式の例外のため、これで常時稼働に近い状態を維持できる。
          # cron はこの連鎖が途切れた場合の再点火役として残す。
          gh workflow run poll.yml --ref "$BRANCH" || echo "self-dispatch failed"
